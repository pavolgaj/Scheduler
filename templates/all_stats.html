<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Global statistics</title>
        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 50px;
            }

            form {
                max-width: 700px;
                margin: 0 auto;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 10px;
                background-color: #f9f9f9;
            }

            .form-group-night {
                display: flex;
                align-items: center;
                margin-bottom: 15px;
            }

            .form-group-night label {
                flex: 1;
            }

            .form-group-night input {
                flex: 1;
                padding: 10px;
                border-radius: 5px;
                width: 100%;
            }

            .form-group-night button {
                flex: 1;
                margin-left: 10px;
            }

            label {
                display: block;
                margin-bottom: 8px;
            }

            button {
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                background-color: #333;
                color: white;
                cursor: pointer;
            }

            button:hover {
                background-color: #555;
            }

            .column-list {
                /* show log files in columns */
                column-count: 4;
                list-style: none;
            }
        </style>
        <script>
            function popup() {
                //show info about running, not block server
                var myDialog = document.createElement("dialog");
                myDialog.id = 'popup';
                document.body.appendChild(myDialog);
                var text = document.createTextNode(" Please, wait...");
                myDialog.appendChild(text);
                myDialog.showModal();
                return true;
            }

            function test() {
                if ((!document.getElementById('start').checkValidity()) || (!document.getElementById('stop').checkValidity())) {
                    return false;
                }

                start=document.getElementById('start').value;
                stop=document.getElementById('stop').value;

                if (start>=stop) {
                    alert('Incorrect observing period! Stop date is smaller than start date.');
                    return false;
                }
                else {
                    //popup();
                    return true;
                }                
            }
        </script>
    </head>

    <body>
        <form method="post" class="left-align" id="log-form">
            <div>
                <center>
                    <h1 style="display: inline;">Global statistics</h1>
                </center>
            </div>
            <br>
            <center><h3>Observing period</h3></center>
            <div class="form-group-night">
                <center><label style="padding: 10px;">from</label></center>
                <input type="date" id="start" name="start" value="{{ start }}" required>
                <center><label style="padding: 10px;">to</label></center>
                <input type="date" id="stop" name="stop" value="{{ stop }}" required>
                <button type="submit" name="generate" title="Generate statistics" onclick="return test()">Generate</button>
                <label>
                </label>
            </div>
            <hr>
            <ul class="column-list">
                {% for name in files %}
                <li><a href="{{ url_for('static',filename='statistics/')}}statistics_{{name}}.pdf"
                        target="_blank">{{name}}</a></li>
                {% endfor %}
            </ul>
        </form>
    </body>

</html>
